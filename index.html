<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀 음료 주문 · Christmas</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, remove, set
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsaJkVT_BoyhwAQZZ66ccta9ctEm8fVww",
    authDomain: "team-order-38843.firebaseapp.com",
    databaseURL: "https://team-order-38843-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "team-order-38843",
    storageBucket: "team-order-38843.firebasestorage.app",
    messagingSenderId: "161521960342",
    appId: "1:161521960342:web:4bd83daf798707f81549b7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ordersRef = ref(db, "orders");

  // expose to global scope so the rest of the page (non-module script) can use it
  window.fbPushOrder = (orderObj) => push(ordersRef, orderObj);
  window.fbDeleteOrder = (id) => remove(ref(db, "orders/" + id));
  window.fbClearAll = () => set(ordersRef, null);
  window.fbListenOrders = (callback) => {
    onValue(ordersRef, (snapshot) => {
      const val = snapshot.val() || {};
      const list = Object.entries(val).map(([id, o]) => ({ id, ...o }));
      list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      callback(list);
    });
  };
  window.fbReady = true;
  window.dispatchEvent(new Event("fb-ready"));
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Gowun+Batang:wght@700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FBF5EA; --ink: #1F1C18; --muted: #6E665C;
    --border: #E7DCCB; --white: #FFFFFF; --red: #B3122E;
    --pine: #0E3B2C; --berry: #B3122E; --gold: #D9A441; --gold-soft: #F6E7C3;
    --brand: #0F6B45; --brand-dark: #0B2E22; --brand-light: #E3F1EA; --brand-gold: #D9A441;
  }
  html { background: var(--cream); }
  body {
    font-family: 'Noto Sans KR', sans-serif; color: var(--ink); min-height: 100vh;
    background:
      radial-gradient(circle at 12% 18%, rgba(217,164,65,.10) 0 2px, transparent 3px) 0 0/46px 46px,
      radial-gradient(circle at 70% 60%, rgba(179,18,46,.07) 0 2px, transparent 3px) 0 0/58px 58px,
      var(--cream);
  }

  /* ── 눈 내리는 효과 ── */
  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .flake {
    position: absolute; top: -12px; color: #fff; opacity: .85;
    text-shadow: 0 0 4px rgba(14,59,44,.35);
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate3d(0,-10px,0) rotate(0deg); }
    100% { transform: translate3d(var(--drift,20px),105vh,0) rotate(220deg); }
  }
  @media (prefers-reduced-motion: reduce) { .snow { display: none; } .bulb { animation: none !important; } }

  .conn-banner {
    display: none; background: #fff3cd; color: #856404; text-align: center;
    font-size: 12px; padding: 8px; font-weight: 600;
  }
  .conn-banner.show { display: block; }

  /* ── 브랜드 선택 바 ── */
  .brand-bar {
    display: flex; gap: 10px; padding: 10px 16px;
    background: linear-gradient(90deg, #0A2A1F, #13241C 50%, #3A0A13);
  }
  .brand-btn {
    flex: 1; padding: 10px; border-radius: 12px; border: 2px solid rgba(255,255,255,.12);
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: rgba(255,255,255,.65);
    background: rgba(255,255,255,.06); transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .brand-btn.sb.active { background: #0F6B45; color: #fff; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(217,164,65,.18); }
  .brand-btn.ts.active { background: #B3122E; color: #fff; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(217,164,65,.18); }

  /* ── 헤더 ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--brand-dark); color: #fff; padding: 14px 18px 18px;
    display: flex; align-items: center; gap: 12px; transition: background .3s;
  }
  .logo-icon {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: rgba(255,255,255,.1); border: 1.5px solid rgba(217,164,65,.6);
  }
  .logo-text { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .logo-sub  { font-size: 11px; opacity: .75; font-weight: 400; display:flex; align-items:center; gap:6px; margin-top: 2px; }
  .xmas-word { font-family: 'Gowun Batang', serif; color: var(--gold); letter-spacing: .5px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#4ADE80; display:inline-block; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .by-hj {
    font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--gold);
    border: 1px solid rgba(217,164,65,.55); border-radius: 20px; padding: 4px 10px;
  }

  /* 전구 장식 */
  .lights {
    position: absolute; left: 0; right: 0; bottom: -9px; height: 18px;
    display: flex; justify-content: space-around; pointer-events: none;
  }
  .lights::before {
    content: ''; position: absolute; left: 0; right: 0; top: 2px; height: 8px;
    border-bottom: 1.5px solid rgba(255,255,255,.35); border-radius: 0 0 50% 50%/0 0 100% 100%;
  }
  .bulb {
    position: relative; top: 6px; width: 7px; height: 11px; border-radius: 50% 50% 45% 45%;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  .bulb:nth-child(4n+1) { background: #FF4D5E; box-shadow: 0 0 8px #FF4D5E; }
  .bulb:nth-child(4n+2) { background: #FFD45C; box-shadow: 0 0 8px #FFD45C; animation-delay: .6s; }
  .bulb:nth-child(4n+3) { background: #4ADE80; box-shadow: 0 0 8px #4ADE80; animation-delay: 1.2s; }
  .bulb:nth-child(4n+4) { background: #7CC7FF; box-shadow: 0 0 8px #7CC7FF; animation-delay: 1.8s; }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .tabs { display: flex; background: var(--brand-dark); padding-top: 8px; transition: background .3s; }
  .tab {
    flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,.55); cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s;
  }
  .tab.active { color: #fff; border-bottom-color: var(--gold); }

  .screen { display: none; padding: 18px 16px 48px; max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  .screen.active { display: block; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--brand); margin-bottom: 10px; transition: color .3s;
    display: flex; align-items: center; gap: 6px;
  }
  .section-label::before { content: '❄'; color: var(--gold); font-size: 11px; }

  .input-field {
    width: 100%; padding: 12px 14px; font-family: inherit; font-size: 15px;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--white);
    outline: none; transition: border-color .2s;
  }
  .input-field:focus { border-color: var(--brand); }
  .name-block { margin-bottom: 22px; }
  .name-row { display: flex; gap: 10px; }
  .name-row > div { flex: 1; min-width: 0; }
  .team-chip-row { display: flex; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }
  .team-chip {
    padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    border: 1.5px solid var(--border); background: var(--white); cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .team-chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }

  .search-bar { position: relative; margin-bottom: 14px; }
  .search-bar input { padding-left: 38px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; flex-wrap: nowrap; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1.5px solid var(--border); background: var(--white); cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .chip.season { border-color: var(--gold); background: var(--gold-soft); color: #7A5410; font-weight: 700; }
  .chip.season.active { background: var(--berry); border-color: var(--berry); color: #fff; }

  .menu-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
  .menu-item {
    background: var(--white); border-radius: 14px; padding: 13px 14px;
    display: flex; align-items: center; gap: 11px;
    cursor: pointer; border: 1.5px solid var(--border); transition: all .15s;
  }
  .menu-item:hover { border-color: var(--brand); }
  .menu-item.selected { border-color: var(--brand); background: var(--brand-light); }
  .menu-item.is-season { border-left: 4px solid var(--berry); }
  .menu-emoji { font-size: 26px; width: 38px; text-align: center; flex-shrink: 0; }
  .menu-info  { flex: 1; min-width: 0; }
  .menu-name    { font-size: 14px; font-weight: 500; margin-bottom: 1px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .menu-name-en { font-size: 11px; color: var(--muted); }
  .menu-tag {
    font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; letter-spacing: .3px;
    background: var(--berry); color: #fff;
  }
  .menu-tag.new { background: var(--gold); color: #3B2A06; }
  .menu-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 12px; transition: all .15s;
  }
  .menu-item.selected .menu-check { background: var(--brand); border-color: var(--brand); color: #fff; }

  .options-panel {
    background: var(--white); border-radius: 16px; padding: 16px;
    margin-bottom: 22px; border: 1.5px solid var(--gold); position: relative;
  }
  .options-title { font-size: 13px; font-weight: 700; color: var(--brand); margin-bottom: 13px; }
  .option-group  { margin-bottom: 13px; }
  .option-label  { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .4px; margin-bottom: 7px; }
  .option-btns   { display: flex; gap: 7px; flex-wrap: wrap; }
  .opt-btn {
    padding: 6px 13px; border-radius: 8px; font-size: 12px; font-weight: 500;
    font-family: inherit; border: 1.5px solid var(--border); background: var(--white);
    cursor: pointer; transition: all .15s;
  }
  .opt-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .memo-input { margin-top: 5px; font-size: 13px; resize: none; height: 56px; }

  .btn-submit {
    width: 100%; padding: 15px; color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: 2px solid var(--gold); border-radius: 14px; cursor: pointer; transition: opacity .2s; letter-spacing: -0.3px;
  }
  .btn-submit:hover { opacity: .92; }
  .btn-submit:disabled { background: #cfc8bd !important; border-color: #cfc8bd; color: #fff !important; opacity: .7; cursor: not-allowed; }

  .summary-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .summary-count { font-size: 21px; font-weight: 700; }
  .summary-count span { color: var(--berry); }
  .btn-copy {
    padding: 8px 15px; background: var(--gold); color: #3B2A06;
    font-family: inherit; font-size: 12px; font-weight: 700;
    border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s;
  }
  .btn-copy:hover { opacity: .85; }

  .group-block { background: var(--white); border-radius: 14px; border: 1.5px solid var(--border); margin-bottom: 18px; overflow: hidden; }
  .team-block { margin-bottom: 22px; }
  .team-block-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px; margin-bottom: 10px; border-bottom: 2px dashed var(--berry);
  }
  .team-block-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .team-block-total { font-size: 13px; color: var(--muted); font-weight: 600; }
  .group-block-header {
    color: #fff; padding: 10px 15px; font-size: 13px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .total-badge { background: rgba(255,255,255,.2); border-radius: 20px; padding: 2px 10px; font-size: 12px; }
  .menu-subheader {
    padding: 9px 15px 5px; background: #FAF4EA; border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;
  }
  .menu-subheader .menu-total { font-size: 12px; }
  .group-row { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--border); gap: 8px; }
  .group-row:last-child { border-bottom: none; }
  .group-row-opts { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .opt-tag { display: inline-block; background: var(--cream); border-radius: 5px; padding: 2px 8px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .opt-tag.highlight { background: #fff3cd; color: #856404; font-weight: 600; }
  .group-row-names { font-size: 11px; color: var(--muted); flex-shrink: 0; max-width: 110px; text-align: right; line-height: 1.5; }
  .group-row-count { font-size: 16px; font-weight: 700; color: var(--brand); flex-shrink: 0; min-width: 32px; text-align: right; }

  .order-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .order-card { background: var(--white); border-radius: 12px; padding: 13px 15px; border: 1.5px solid var(--border); }
  .order-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .order-person { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .team-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 700; background: var(--gold-soft); color: #6B4A0E; }
  .order-brand-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
  .order-menu-name { font-size: 13px; color: var(--brand); font-weight: 500; }
  .order-opts { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .btn-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 5px; }
  .btn-delete:hover { color: var(--red); }

  .copy-box {
    background: #10241B; color: #F1E9D8; border-radius: 12px; padding: 16px; border: 1px solid rgba(217,164,65,.4);
    font-size: 12px; line-height: 2; white-space: pre-wrap; word-break: keep-all; margin-bottom: 10px;
  }
  .btn-clear {
    width: 100%; padding: 12px; background: none; color: var(--red);
    font-family: inherit; font-size: 13px; font-weight: 500;
    border: 1.5px solid #f2c3c9; border-radius: 10px; cursor: pointer; margin-top: 4px;
  }
  .btn-clear:hover { background: #fff0f1; }

  .empty-state { text-align: center; padding: 44px 20px; color: var(--muted); }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: var(--pine); color: #fff; padding: 11px 22px; border-radius: 30px; border: 1px solid var(--gold);
    font-size: 13px; font-weight: 500; transition: transform .3s ease; z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="snow" id="snow" aria-hidden="true"></div>
<div class="conn-banner" id="conn-banner">⏳ 서버에 연결 중입니다...</div>

<div class="brand-bar">
  <button class="brand-btn sb active" id="btn-brand-sb" onclick="setBrand('sb')">☕ 스타벅스</button>
  <button class="brand-btn ts"        id="btn-brand-ts" onclick="setBrand('ts')">🎂 투썸플레이스</button>
</div>

<header id="main-header">
  <div class="logo-icon" id="logo-icon">🎄</div>
  <div style="flex:1; min-width:0">
    <div class="logo-text" id="logo-text">스타벅스 팀 주문</div>
    <div class="logo-sub"><span class="xmas-word">Merry Christmas</span> · <span class="live-dot"></span> 실시간 공유 중</div>
  </div>
  <div class="by-hj">by HJ</div>
  <div class="lights" aria-hidden="true">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
  </div>
</header>

<div class="tabs" id="main-tabs">
  <div class="tab active" onclick="switchTab('order')">🎁 메뉴 신청</div>
  <div class="tab" onclick="switchTab('summary')">📋 주문 취합</div>
</div>

<!-- ORDER -->
<div id="screen-order" class="screen active">
  <div class="name-block">
    <div class="section-label">소속(팀명)</div>
    <div class="team-chip-row" id="team-chips"></div>
    <div class="name-row">
      <div><input class="input-field" id="input-team" type="text" placeholder="직접 입력 (예: 영업1팀)" maxlength="14"></div>
      <div><input class="input-field" id="input-name" type="text" placeholder="이름" maxlength="10"></div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input class="input-field" id="menu-search" type="text" placeholder="메뉴 검색" oninput="renderMenu()">
  </div>
  <div class="chips" id="category-chips"></div>
  <div class="menu-list" id="menu-list"></div>

  <div id="options-panel" class="options-panel" style="display:none">
    <div class="options-title">🎀 옵션 선택</div>
    <div class="option-group"><div class="option-label">온도</div><div class="option-btns" id="opt-temp"></div></div>

<!-- SUMMARY -->

  <div class="summary-top">
    <div class="summary-count">총 <span id="order-count">0</span>건</div>
    <button class="btn-copy" onclick="copyOrders()">📋 복사하기</button>
  </div>
  <div id="group-summary-area"></div>
  <div class="section-label" style="margin-bottom:10px">개별 주문 목록</div>

  <div id="copy-area" style="display:none">
    <div class="section-label" style="margin-bottom:8px">복사 텍스트</div>

  <button class="btn-clear" onclick="clearAll()">🗑 전체 주문 초기화</button>

<div class="toast" id="toast"></div>

<script>
// ── 메뉴 데이터 (2026.10.24 기준) ─────────────────────
// 스타벅스: starbucks.co.kr 공식 상품 페이지 + 신세계그룹 뉴스룸 보도자료(2026.10.21, 크리스마스 시즌 10.22~)
// 투썸: 매장 레시피 매뉴얼(twosome-recipe-app, 2026.10.23) 기준 — 여름 한정(빙수·눈꽃컵·수박/멜론 주스 등) 제외
const M = (id, cat, emoji, name, en, temps, sizes, shot, sweet, tag) =>
  ({ id, cat, emoji, name, en, temps, sizes, shot, sweet, tag: tag || '' });

    M(190,'케이크·디저트','🎂','떠먹는 스초생',            'Strawberry Choco Cake Cup', ['—'], ['조각'], false, false),
    M(191,'케이크·디저트','🎂','떠먹는 아박',              'Iced Box Cup',              ['—'], ['조각'], false, false),
    M(192,'케이크·디저트','🎂','떠먹는 마스카포네 티라미수','Mascarpone Tiramisu Cup',   ['—'], ['조각'], false, false),
    M(193,'케이크·디저트','🎂','뉴욕 치즈케이크',          'New York Cheesecake',       ['—'], ['조각'], false, false),
    M(194,'케이크·디저트','🍮','바닐라빈 크렘브륄레',      'Vanilla Bean Crème Brûlée', ['—'], ['조각'], false, false, 'NEW'),
  ],
};

const SHOTS  = ['기본', '+1샷', '+2샷'];
const SWEETS = ['기본', '시럽 반만', '시럽 없이'];
const BRAND_CFG = {
  sb: { label:'스타벅스 팀 주문', short:'스타벅스', icon:'☕', color:'#0F6B45', dark:'#0B2E22', light:'#E3F1EA', gold:'#D9A441', badgeBg:'#E3F1EA', badgeFg:'#0F6B45' },
  ts: { label:'투썸 팀 주문',     short:'투썸',     icon:'🎂', color:'#B3122E', dark:'#4E0A15', light:'#FBE3E6', gold:'#D9A441', badgeBg:'#FBE3E6', badgeFg:'#B3122E' },
};
// 예전에 저장된 폴바셋 주문 등 알 수 없는 브랜드도 취합 화면이 깨지지 않도록
const LEGACY_CFG = { pb: { label:'폴바셋 팀 주문', short:'폴바셋', icon:'🫘', color:'#5B4636', badgeBg:'#EDE0D4', badgeFg:'#5B4636' } };
function cfgOf(brand) {
  return BRAND_CFG[brand] || LEGACY_CFG[brand] || { label:'기타', short:'기타', icon:'🥤', color:'#666', badgeBg:'#eee', badgeFg:'#555' };
}

let currentBrand = 'sb';
let orders = [];           // 이제 Firebase에서 실시간으로 채워짐
let selectedMenu = null;
let currentCat   = '전체';
let options = { temp:'', size:'', shot:'기본', sweet:'기본' };
let fbConnected = false;

// ── Firebase 연결 대기 ──────────────────────────────
window.addEventListener('fb-ready', () => {
  fbConnected = true;
  document.getElementById('conn-banner').classList.remove('show');
  window.fbListenOrders((list) => {
    orders = list;
    renderSummary();
  });
});

// 일정 시간 지나도 연결 안 되면 배너 표시
setTimeout(() => {
  if (!fbConnected) document.getElementById('conn-banner').classList.add('show');
}, 1500);

// ── 팀명 프리셋 칩 ───────────────────────────────────
const TEAM_PRESETS = ['여의도지점', '임시사용'];

function renderTeamChips() {
  const el = document.getElementById('team-chips');
  el.innerHTML = '';
  TEAM_PRESETS.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'team-chip';
    chip.textContent = t;
    chip.onclick = () => {
      const input = document.getElementById('input-team');
      input.value = t;
      renderTeamChips(); // re-render to update active state
      checkSubmit();
    };
    if (document.getElementById('input-team').value.trim() === t) chip.classList.add('active');
    el.appendChild(chip);
  });
}

document.getElementById('input-team').addEventListener('input', renderTeamChips);

// ── 초기화 ───────────────────────────────────────────
function init() {
  applyBrandCSS('sb');
  document.getElementById('input-team').value = '여의도지점';
  renderTeamChips();
  renderChips();
  renderMenu();
  renderSummary();
}

function setBrand(brand) {
  currentBrand = brand;
  selectedMenu = null;
  currentCat   = '전체';
  options = { temp:'', size:'', shot:'기본', sweet:'기본' };
  document.getElementById('options-panel').style.display = 'none';
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('menu-search').value = '';
  document.getElementById('btn-brand-sb').classList.toggle('active', brand === 'sb');
  document.getElementById('btn-brand-ts').classList.toggle('active', brand === 'ts');
  applyBrandCSS(brand);
  renderChips();
  renderMenu();
}

function applyBrandCSS(brand) {
  const cfg = BRAND_CFG[brand];
  const root = document.documentElement;
  root.style.setProperty('--brand',      cfg.color);
  root.style.setProperty('--brand-dark', cfg.dark);
  root.style.setProperty('--brand-light',cfg.light);
  root.style.setProperty('--brand-gold', cfg.gold);
  document.getElementById('main-header').style.background = cfg.dark;
  document.getElementById('main-tabs').style.background   = cfg.dark;
  document.getElementById('logo-text').textContent = cfg.label;
}

function getMenus() { return MENUS[currentBrand]; }

function renderChips() {
  const cats = ['전체', ...new Set(getMenus().map(m => m.cat))];
  const el = document.getElementById('category-chips');
  el.innerHTML = '';
  cats.forEach(cat => {
    const d = document.createElement('div');
    d.className = 'chip' + (/^[🎄🍂]/u.test(cat) ? ' season' : '') + (cat === currentCat ? ' active' : '');
    d.textContent = cat;
    d.onclick = () => { currentCat = cat; renderChips(); renderMenu(); };
    el.appendChild(d);
  });
}

function renderMenu() {
  const q = document.getElementById('menu-search').value.trim().toLowerCase();
  const list = getMenus().filter(m => {
    const catOk = currentCat === '전체' || m.cat === currentCat;
    const qOk   = !q || m.name.includes(q) || m.en.toLowerCase().includes(q);
    return catOk && qOk;
  });
  const el = document.getElementById('menu-list');
  el.innerHTML = '';
  list.forEach(m => {
    const isSel = selectedMenu?.id === m.id && selectedMenu?.brand === currentBrand;
    const div = document.createElement('div');
    div.className = 'menu-item' + (isSel ? ' selected' : '') + (m.tag ? ' is-season' : '');
    const tagHtml = m.tag ? `<span class="menu-tag${m.tag === 'NEW' ? ' new' : ''}">${m.tag}</span>` : '';
    div.innerHTML = `
      <div class="menu-emoji">${m.emoji}</div>
      <div class="menu-info">
        <div class="menu-name">${m.name}${tagHtml}</div>
        <div class="menu-name-en">${m.en}</div>
      </div>
      <div class="menu-check">${isSel ? '✓' : ''}</div>`;
    div.onclick = () => selectMenu(m);
    el.appendChild(div);
  });
}

function selectMenu(m) {
  selectedMenu = { ...m, brand: currentBrand };
  renderMenu();
  options = { temp:'', size:'', shot:'기본', sweet:'기본' };

  const tempEl = document.getElementById('opt-temp');
  const labels = { HOT:'🔴 HOT', ICED:'🔵 ICED', BLENDED:'🟣 블렌디드', '—':'해당없음' };
  tempEl.innerHTML = '';
  m.temps.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = labels[t] || t;
    btn.onclick = () => { options.temp = t; setActive(tempEl, btn); renderSizes(m); checkSubmit(); };
    tempEl.appendChild(btn);
  });
  if (m.temps.length === 1) { options.temp = m.temps[0]; tempEl.querySelector('.opt-btn').classList.add('active'); }

  renderSizes(m);

  document.getElementById('opt-shot-group').style.display  = m.shot  ? 'block' : 'none';
  document.getElementById('opt-sweet-group').style.display = m.sweet ? 'block' : 'none';
  if (m.shot)  renderOptBtns('opt-shot',  SHOTS,  'shot');
  if (m.sweet) renderOptBtns('opt-sweet', SWEETS, 'sweet');

  document.getElementById('opt-memo').value = '';
  document.getElementById('options-panel').style.display = 'block';
  checkSubmit();
  setTimeout(() => document.getElementById('options-panel').scrollIntoView({ behavior:'smooth', block:'nearest' }), 50);
}

// 사이즈 버튼 (투썸 Max는 ICED 전용이라 HOT이면 숨김)
function renderSizes(m) {
  const sizeEl = document.getElementById('opt-size');
  const list = (options.temp === 'HOT') ? m.sizes.filter(s => s !== 'Max') : m.sizes;
  if (!list.includes(options.size)) options.size = '';
  sizeEl.innerHTML = '';
  list.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (s === options.size ? ' active' : '');
    btn.textContent = s;
    btn.onclick = () => { options.size = s; setActive(sizeEl, btn); checkSubmit(); };
    sizeEl.appendChild(btn);
  });
  if (list.length === 1) { options.size = list[0]; sizeEl.querySelector('.opt-btn').classList.add('active'); }
}

function renderOptBtns(id, list, key) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  list.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (i === 0 ? ' active' : '');
    btn.textContent = item;
    btn.onclick = () => { options[key] = item; setActive(el, btn); checkSubmit(); };
    el.appendChild(btn);
  });
  options[key] = list[0];
}

function setActive(parent, btn) {
  parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function checkSubmit() {
  const team = document.getElementById('input-team').value.trim();
  const name = document.getElementById('input-name').value.trim();
  const needsTemp = selectedMenu && selectedMenu.temps[0] !== '—';
  const ok = team && name && selectedMenu && (!needsTemp || options.temp) && options.size;
  document.getElementById('btn-submit').disabled = !ok;
}

document.getElementById('input-team').addEventListener('input', checkSubmit);
document.getElementById('input-name').addEventListener('input', checkSubmit);

function submitOrder() {
  if (!fbConnected) { showToast('서버 연결 중입니다. 잠시 후 다시 시도해주세요.'); return; }
  const team = document.getElementById('input-team').value.trim();
  const name = document.getElementById('input-name').value.trim();
  const memo = document.getElementById('opt-memo').value.trim();
  const m = selectedMenu;
  const order = {
    brand: currentBrand,
    team,
    name,
    menuName: m.name,
    emoji: m.emoji,
    temp:  options.temp  || '',
    size:  options.size  || '',
    shot:  m.shot  ? options.shot  : '',
    sweet: m.sweet ? options.sweet : '',
    memo,
    time: new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }),
    createdAt: Date.now()
  };

  window.fbPushOrder(order)
    .then(() => {
      showToast(`🎁 ${team} ${name}님 주문 완료!`);
      selectedMenu = null;
      options = { temp:'', size:'', shot:'기본', sweet:'기본' };
      document.getElementById('input-name').value = '';
      document.getElementById('options-panel').style.display = 'none';
      document.getElementById('menu-search').value = '';
      document.getElementById('btn-submit').disabled = true;
      renderMenu();
    })
    .catch((err) => {
      showToast('전송 실패. 다시 시도해주세요.');
      console.error(err);
    });
}

// ── 옵션 레이블 ──────────────────────────────────────
function makeOptTags(o) {
  const tags = [];
  if (o.temp && o.temp !== '—') tags.push({ text: o.temp, highlight: false });
  if (o.size) tags.push({ text: o.size, highlight: false });
  if (o.shot  && o.shot  !== '기본') tags.push({ text: o.shot,  highlight: true });
  if (o.sweet && o.sweet !== '기본') tags.push({ text: o.sweet, highlight: true });
  if (o.memo) tags.push({ text: '📝 ' + o.memo, highlight: false });
  return tags;
}

function orderKey(o) {
  return [o.brand, o.menuName, o.temp, o.size, o.shot || '', o.sweet || '', o.memo || ''].join('|');
}

function renderSummary() {
  document.getElementById('order-count').textContent = orders.length;
  const cards     = document.getElementById('order-cards');
  const groupArea = document.getElementById('group-summary-area');
  cards.innerHTML = '';
  groupArea.innerHTML = '';

  if (orders.length === 0) {
    cards.innerHTML = `<div class="empty-state"><div class="empty-icon">🎄</div><p>아직 신청된 주문이 없어요</p></div>`;
    document.getElementById('copy-area').style.display = 'none';
    return;
  }

  // ── 팀 > 브랜드 > 메뉴 > 옵션 단위로 그룹 ──
  const teamMap = {};
  orders.forEach(o => {
    const team = o.team || '미지정';
    if (!teamMap[team]) teamMap[team] = {};
    if (!teamMap[team][o.brand]) teamMap[team][o.brand] = {};
    const mk = `${o.emoji} ${o.menuName}`;
    if (!teamMap[team][o.brand][mk]) teamMap[team][o.brand][mk] = {};
    const ok = orderKey(o);
    if (!teamMap[team][o.brand][mk][ok]) teamMap[team][o.brand][mk][ok] = { o, names: [], count: 0 };
    teamMap[team][o.brand][mk][ok].names.push(o.name);
    teamMap[team][o.brand][mk][ok].count++;
  });

  // 팀 이름 가나다순 정렬 (미지정은 맨 뒤)
  const teamNames = Object.keys(teamMap).sort((a, b) => {
    if (a === '미지정') return 1;
    if (b === '미지정') return -1;
    return a.localeCompare(b, 'ko');
  });

  teamNames.forEach(team => {
    const brandsInTeam = teamMap[team];
    const teamTotal = orders.filter(o => (o.team || '미지정') === team).length;

    const teamBlock = document.createElement('div');
    teamBlock.className = 'team-block';
    let teamHtml = `<div class="team-block-header">
      <div class="team-block-title"><span class="team-icon">👥</span>${team}</div>
      <div class="team-block-total">총 ${teamTotal}잔</div>
    </div>`;

    Object.entries(brandsInTeam).forEach(([brand, menus]) => {
      const cfg   = cfgOf(brand);
      const total = orders.filter(o => (o.team || '미지정') === team && o.brand === brand).length;
      let html = `<div class="group-block">
        <div class="group-block-header" style="background:${cfg.color}">
          <span>${cfg.icon} ${cfg.short}</span>
          <span class="total-badge">총 ${total}잔</span>
        </div>`;

      Object.entries(menus).forEach(([menuKey, optMap]) => {
        const menuTotal = Object.values(optMap).reduce((s,v) => s + v.count, 0);
        html += `<div class="menu-subheader">
          <span>${menuKey}</span>
          <span class="menu-total" style="color:${cfg.color}">${menuTotal}잔</span>
        </div>`;

        Object.values(optMap).forEach(({ o, names, count }) => {
          const tags = makeOptTags(o);
          const tagHtml = tags.length
            ? tags.map(t => `<span class="opt-tag${t.highlight ? ' highlight' : ''}">${t.text}</span>`).join('')
            : `<span class="opt-tag">기본 옵션</span>`;
          html += `<div class="group-row">
            <div class="group-row-opts">${tagHtml}</div>
            <div class="group-row-names">${names.join('<br>')}</div>
            <div class="group-row-count">×${count}</div>
          </div>`;
        });
      });

      html += `</div>`;
      teamHtml += html;
    });

    teamBlock.innerHTML = teamHtml;
    groupArea.appendChild(teamBlock);
  });

  // ── 개별 카드 (최신순) ──
  orders.forEach((o) => {
    const tags = makeOptTags(o);
    const tagStr = tags.map(t => t.text).join(' · ') || '기본 옵션';
    const bc = cfgOf(o.brand);
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="order-card-top">
        <span class="order-person"><span class="team-badge">${o.team||'미지정'}</span>${o.name}<span class="order-brand-badge" style="background:${bc.badgeBg};color:${bc.badgeFg}">${bc.short}</span></span>
        <button class="btn-delete" onclick="deleteOrder('${o.id}')">✕</button>
      </div>
      <div class="order-menu-name">${o.emoji} ${o.menuName}</div>
      <div class="order-opts">${tagStr} <span style="color:#ccc;margin-left:4px">${o.time||''}</span></div>`;
    cards.appendChild(card);
  });

  // ── 복사 텍스트 (팀별로 구분) ──
  const lines = [];
  teamNames.forEach(team => {
    lines.push(`🎄━━━━━━━━━━━━━`);
    lines.push(`👥 [${team}]`);
    const brandsInTeam = teamMap[team];
    Object.entries(brandsInTeam).forEach(([brand, menus]) => {
      const cfg = cfgOf(brand);
      lines.push(`${cfg.icon} ${cfg.short}`);
      Object.entries(menus).forEach(([menuKey, optMap]) => {
        lines.push(`▸ ${menuKey}`);
        Object.values(optMap).forEach(({ o, names, count }) => {
          const tags = makeOptTags(o);
          const optStr = tags.filter(t => !t.text.startsWith('📝')).map(t => t.text).join('/') || '기본';
          const memo = tags.find(t => t.text.startsWith('📝'));
          lines.push(`   ${optStr} × ${count}  (${names.join(', ')})${memo ? '  ' + memo.text : ''}`);
        });
      });
    });
    lines.push('');
  });
  lines.push(`📊 전체 총 ${orders.length}건`);
  document.getElementById('copy-box').textContent = lines.join('\n');
  document.getElementById('copy-area').style.display = 'block';
}

function deleteOrder(id) {
  window.fbDeleteOrder(id).then(() => showToast('주문이 삭제되었습니다'));
}

function clearAll() {
  if (!confirm('전체 주문을 초기화할까요? (모든 사람에게 영향을 줍니다)')) return;
  window.fbClearAll().then(() => showToast('초기화 완료'));
}

function copyOrders() {
  navigator.clipboard.writeText(document.getElementById('copy-box').textContent)
    .then(() => showToast('클립보드에 복사됐어요 📋'));
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i===0 && tab==='order') || (i===1 && tab==='summary'));
  });
  document.getElementById('screen-order').classList.toggle('active', tab==='order');
  document.getElementById('screen-summary').classList.toggle('active', tab==='summary');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 눈 내리기 ──
function makeSnow() {
  const box = document.getElementById('snow');
  const chars = ['❄','❅','❆','•'];
  for (let i = 0; i < 26; i++) {
    const f = document.createElement('span');
    f.className = 'flake';
    f.textContent = chars[i % chars.length];
    f.style.left = (Math.random() * 100) + 'vw';
    f.style.fontSize = (8 + Math.random() * 10) + 'px';
    f.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
    f.style.animationDuration = (9 + Math.random() * 10) + 's';
    f.style.animationDelay = (-Math.random() * 18) + 's';
    f.style.setProperty('--drift', ((Math.random() * 60) - 30) + 'px');
    box.appendChild(f);
  }
}

makeSnow();
init();
</script>
