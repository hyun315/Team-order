<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, remove, set
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsaJkVT_BoyhwAQZZ66ccta9ctEm8fVww",
    authDomain: "team-order-38843.firebaseapp.com",
    databaseURL: "https://team-order-38843-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "team-order-38843",
    storageBucket: "team-order-38843.firebasestorage.app",
    messagingSenderId: "161521960342",
    appId: "1:161521960342:web:4bd83daf798707f81549b7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ordersRef = ref(db, "orders");

  // expose to global scope so the rest of the page (non-module script) can use it
  window.fbPushOrder = (orderObj) => push(ordersRef, orderObj);
  window.fbDeleteOrder = (id) => remove(ref(db, "orders/" + id));
  window.fbClearAll = () => set(ordersRef, null);
  window.fbListenOrders = (callback) => {
    onValue(ordersRef, (snapshot) => {
      const val = snapshot.val() || {};
      const list = Object.entries(val).map(([id, o]) => ({ id, ...o }));
      list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      callback(list);
    });
  };
  window.fbReady = true;
  window.dispatchEvent(new Event("fb-ready"));
</script>
<style>

const SHOTS  = ['기본', '+1샷', '+2샷'];
const SWEETS = ['기본', '시럽 반만', '시럽 없이'];
const BRAND_CFG = {
  sb: { label:'스타벅스 팀 주문', sub:'Starbucks Team Order', icon:'☕', color:'#00704A', dark:'#1E3932', light:'#D4E9E2', gold:'#CBA258' },
  ts: { label:'투썸 팀 주문',     sub:'A Twosome Place Order', icon:'🎂', color:'#C8102E', dark:'#8B0000', light:'#ffe0e4', gold:'#E8A020' },
};

let currentBrand = 'sb';
let orders = [];           // 이제 Firebase에서 실시간으로 채워짐
let selectedMenu = null;
let currentCat   = '전체';
let options = { temp:'', size:'', shot:'기본', sweet:'기본' };
let fbConnected = false;

// ── Firebase 연결 대기 ──────────────────────────────
window.addEventListener('fb-ready', () => {
  fbConnected = true;
  document.getElementById('conn-banner').classList.remove('show');
  window.fbListenOrders((list) => {
    orders = list;
    renderSummary();
  });
});

// 일정 시간 지나도 연결 안 되면 배너 표시
setTimeout(() => {
  if (!fbConnected) document.getElementById('conn-banner').classList.add('show');
}, 1500);

// ── 팀명 프리셋 칩 ───────────────────────────────────
const TEAM_PRESETS = ['여의도지점', '임시사용'];

function renderTeamChips() {
  const el = document.getElementById('team-chips');
  el.innerHTML = '';
  TEAM_PRESETS.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'team-chip';
    chip.textContent = t;
    chip.onclick = () => {
      const input = document.getElementById('input-team');
      input.value = t;
      renderTeamChips(); // re-render to update active state
      checkSubmit();
    };
    if (document.getElementById('input-team').value.trim() === t) chip.classList.add('active');
    el.appendChild(chip);
  });
}

document.getElementById('input-team').addEventListener('input', renderTeamChips);

// ── 초기화 ───────────────────────────────────────────
function init() {
  applyBrandCSS('sb');
  renderTeamChips();
  renderChips();
  renderMenu();
  renderSummary();
}

function setBrand(brand) {
  currentBrand = brand;
  selectedMenu = null;
  currentCat   = '전체';
  options = { temp:'', size:'', shot:'기본', sweet:'기본' };
  document.getElementById('options-panel').style.display = 'none';
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('menu-search').value = '';
  document.getElementById('btn-brand-sb').classList.toggle('active', brand === 'sb');
  document.getElementById('btn-brand-ts').classList.toggle('active', brand === 'ts');
  applyBrandCSS(brand);
  renderChips();
  renderMenu();
}

function applyBrandCSS(brand) {
  const cfg = BRAND_CFG[brand];
  const root = document.documentElement;
  root.style.setProperty('--brand',      cfg.color);
  root.style.setProperty('--brand-dark', cfg.dark);
  root.style.setProperty('--brand-light',cfg.light);
  root.style.setProperty('--brand-gold', cfg.gold);
  document.getElementById('main-header').style.background = cfg.dark;
  document.getElementById('main-tabs').style.background   = cfg.dark;
  document.getElementById('logo-icon').textContent = cfg.icon;
  document.getElementById('logo-text').textContent = cfg.label;
}

function getMenus() { return MENUS[currentBrand]; }

function renderChips() {
  const cats = ['전체', ...new Set(getMenus().map(m => m.cat))];
  const el = document.getElementById('category-chips');
  el.innerHTML = '';
  cats.forEach(cat => {
    const d = document.createElement('div');
    d.className = 'chip' + (cat === currentCat ? ' active' : '');
    d.textContent = cat;
    d.onclick = () => { currentCat = cat; renderChips(); renderMenu(); };
    el.appendChild(d);
  });
}

function renderMenu() {
  const q = document.getElementById('menu-search').value.trim().toLowerCase();
  const list = getMenus().filter(m => {
    const catOk = currentCat === '전체' || m.cat === currentCat;
    const qOk   = !q || m.name.includes(q) || m.en.toLowerCase().includes(q);
    return catOk && qOk;
  });
  const el = document.getElementById('menu-list');
  el.innerHTML = '';
  list.forEach(m => {
    const isSel = selectedMenu?.id === m.id && selectedMenu?.brand === currentBrand;
    const div = document.createElement('div');
    div.className = 'menu-item' + (isSel ? ' selected' : '');
    div.innerHTML = `
      <div class="menu-emoji">${m.emoji}</div>
      <div class="menu-info">
        <div class="menu-name">${m.name}</div>
        <div class="menu-name-en">${m.en}</div>
      </div>
      <div class="menu-check">${isSel ? '✓' : ''}</div>`;
    div.onclick = () => selectMenu(m);
    el.appendChild(div);
  });
}

function selectMenu(m) {
  selectedMenu = { ...m, brand: currentBrand };
  renderMenu();
  options = { temp:'', size:'', shot:'기본', sweet:'기본' };

  const tempEl = document.getElementById('opt-temp');
  const labels = { HOT:'🔴 HOT', ICED:'🔵 ICED', BLENDED:'🟣 블렌디드', '—':'해당없음' };
  tempEl.innerHTML = '';
  m.temps.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = labels[t] || t;
    btn.onclick = () => { options.temp = t; setActive(tempEl, btn); checkSubmit(); };
    tempEl.appendChild(btn);
  });
  if (m.temps.length === 1) { options.temp = m.temps[0]; tempEl.querySelector('.opt-btn').classList.add('active'); }

  const sizeEl = document.getElementById('opt-size');
  sizeEl.innerHTML = '';
  m.sizes.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = s;
    btn.onclick = () => { options.size = s; setActive(sizeEl, btn); checkSubmit(); };
    sizeEl.appendChild(btn);
  });
  if (m.sizes.length === 1) { options.size = m.sizes[0]; sizeEl.querySelector('.opt-btn').classList.add('active'); }

  document.getElementById('opt-shot-group').style.display  = m.shot  ? 'block' : 'none';
  document.getElementById('opt-sweet-group').style.display = m.sweet ? 'block' : 'none';
  if (m.shot)  renderOptBtns('opt-shot',  SHOTS,  'shot');
  if (m.sweet) renderOptBtns('opt-sweet', SWEETS, 'sweet');

  document.getElementById('opt-memo').value = '';
  document.getElementById('options-panel').style.display = 'block';
  checkSubmit();
  setTimeout(() => document.getElementById('options-panel').scrollIntoView({ behavior:'smooth', block:'nearest' }), 50);
}

function renderOptBtns(id, list, key) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  list.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (i === 0 ? ' active' : '');
    btn.textContent = item;
    btn.onclick = () => { options[key] = item; setActive(el, btn); checkSubmit(); };
    el.appendChild(btn);
  });
  options[key] = list[0];
}

function setActive(parent, btn) {
  parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function checkSubmit() {
  const team = document.getElementById('input-team').value.trim();
  const name = document.getElementById('input-name').value.trim();
  const needsTemp = selectedMenu && selectedMenu.temps[0] !== '—';
  const ok = team && name && selectedMenu && (!needsTemp || options.temp) && options.size;
  document.getElementById('btn-submit').disabled = !ok;
}

document.getElementById('input-team').addEventListener('input', checkSubmit);
document.getElementById('input-name').addEventListener('input', checkSubmit);

function submitOrder() {
  if (!fbConnected) { showToast('서버 연결 중입니다. 잠시 후 다시 시도해주세요.'); return; }
  const team = document.getElementById('input-team').value.trim();
  const name = document.getElementById('input-name').value.trim();
  const memo = document.getElementById('opt-memo').value.trim();
  const m = selectedMenu;
  const order = {
    brand: currentBrand,
    team,
    name,
    menuName: m.name,
    emoji: m.emoji,
    temp:  options.temp  || '',
    size:  options.size  || '',
    shot:  m.shot  ? options.shot  : '',
    sweet: m.sweet ? options.sweet : '',
    memo,
    time: new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }),
    createdAt: Date.now()
  };

  window.fbPushOrder(order)
    .then(() => {
      showToast(`${team} ${name}님 주문 완료! ✅`);
      selectedMenu = null;
      options = { temp:'', size:'', shot:'기본', sweet:'기본' };
      document.getElementById('input-name').value = '';
      document.getElementById('options-panel').style.display = 'none';
      document.getElementById('menu-search').value = '';
      document.getElementById('btn-submit').disabled = true;
      renderMenu();
    })
    .catch((err) => {
      showToast('전송 실패. 다시 시도해주세요.');
      console.error(err);
    });
}

// ── 옵션 레이블 ──────────────────────────────────────
function makeOptTags(o) {
  const tags = [];
  if (o.temp && o.temp !== '—') tags.push({ text: o.temp, highlight: false });
  if (o.size) tags.push({ text: o.size, highlight: false });
  if (o.shot  && o.shot  !== '기본') tags.push({ text: o.shot,  highlight: true });
  if (o.sweet && o.sweet !== '기본') tags.push({ text: o.sweet, highlight: true });
  if (o.memo) tags.push({ text: '📝 ' + o.memo, highlight: false });
  return tags;
}

function orderKey(o) {
  return [o.brand, o.menuName, o.temp, o.size, o.shot || '', o.sweet || '', o.memo || ''].join('|');
}

function renderSummary() {
  document.getElementById('order-count').textContent = orders.length;
  const cards     = document.getElementById('order-cards');
  const groupArea = document.getElementById('group-summary-area');
  cards.innerHTML = '';
  groupArea.innerHTML = '';

  if (orders.length === 0) {
    cards.innerHTML = `<div class="empty-state"><div class="empty-icon">☕</div><p>아직 신청된 주문이 없어요</p></div>`;
    document.getElementById('copy-area').style.display = 'none';
    return;
  }

  // ── 팀 > 브랜드 > 메뉴 > 옵션 단위로 그룹 ──
  const teamMap = {};
  orders.forEach(o => {
    const team = o.team || '미지정';
    if (!teamMap[team]) teamMap[team] = {};
    if (!teamMap[team][o.brand]) teamMap[team][o.brand] = {};
    const mk = `${o.emoji} ${o.menuName}`;
    if (!teamMap[team][o.brand][mk]) teamMap[team][o.brand][mk] = {};
    const ok = orderKey(o);
    if (!teamMap[team][o.brand][mk][ok]) teamMap[team][o.brand][mk][ok] = { o, names: [], count: 0 };
    teamMap[team][o.brand][mk][ok].names.push(o.name);
    teamMap[team][o.brand][mk][ok].count++;
  });

  // 팀 이름 가나다순 정렬 (미지정은 맨 뒤)
  const teamNames = Object.keys(teamMap).sort((a, b) => {
    if (a === '미지정') return 1;
    if (b === '미지정') return -1;
    return a.localeCompare(b, 'ko');
  });

  teamNames.forEach(team => {
    const brandsInTeam = teamMap[team];
    const teamTotal = orders.filter(o => (o.team || '미지정') === team).length;

    const teamBlock = document.createElement('div');
    teamBlock.className = 'team-block';
    let teamHtml = `<div class="team-block-header">
      <div class="team-block-title"><span class="team-icon">👥</span>${team}</div>
      <div class="team-block-total">총 ${teamTotal}잔</div>
    </div>`;

    Object.entries(brandsInTeam).forEach(([brand, menus]) => {
      const cfg   = BRAND_CFG[brand];
      const total = orders.filter(o => (o.team || '미지정') === team && o.brand === brand).length;
      let html = `<div class="group-block">
        <div class="group-block-header" style="background:${cfg.color}">
          <span>${cfg.icon} ${cfg.label.replace(' 팀 주문','')}</span>
          <span class="total-badge">총 ${total}잔</span>
        </div>`;

      Object.entries(menus).forEach(([menuKey, optMap]) => {
        const menuTotal = Object.values(optMap).reduce((s,v) => s + v.count, 0);
        html += `<div class="menu-subheader">
          <span>${menuKey}</span>
          <span class="menu-total" style="color:${cfg.color}">${menuTotal}잔</span>
        </div>`;

        Object.values(optMap).forEach(({ o, names, count }) => {
          const tags = makeOptTags(o);
          const tagHtml = tags.length
            ? tags.map(t => `<span class="opt-tag${t.highlight ? ' highlight' : ''}">${t.text}</span>`).join('')
            : `<span class="opt-tag">기본 옵션</span>`;
          html += `<div class="group-row">
            <div class="group-row-opts">${tagHtml}</div>
            <div class="group-row-names">${names.join('<br>')}</div>
            <div class="group-row-count">×${count}</div>
          </div>`;
        });
      });

      html += `</div>`;
      teamHtml += html;
    });

    teamBlock.innerHTML = teamHtml;
    groupArea.appendChild(teamBlock);
  });

  // ── 개별 카드 (최신순) ──
  orders.forEach((o) => {
    const tags = makeOptTags(o);
    const tagStr = tags.map(t => t.text).join(' · ') || '기본 옵션';
    const badgeClass = o.brand === 'sb' ? 'badge-sb' : 'badge-ts';
    const brandLabel = o.brand === 'sb' ? '스타벅스' : '투썸';
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="order-card-top">
        <span class="order-person"><span class="team-badge">${o.team||'미지정'}</span>${o.name}<span class="order-brand-badge ${badgeClass}">${brandLabel}</span></span>
        <button class="btn-delete" onclick="deleteOrder('${o.id}')">✕</button>
      </div>
      <div class="order-menu-name">${o.emoji} ${o.menuName}</div>
      <div class="order-opts">${tagStr} <span style="color:#ccc;margin-left:4px">${o.time||''}</span></div>`;
    cards.appendChild(card);
  });

  // ── 복사 텍스트 (팀별로 구분) ──
  const lines = [];
  teamNames.forEach(team => {
    lines.push(`━━━━━━━━━━━━━`);
    lines.push(`👥 [${team}]`);
    const brandsInTeam = teamMap[team];
    Object.entries(brandsInTeam).forEach(([brand, menus]) => {
      const cfg = BRAND_CFG[brand];
      lines.push(`${cfg.icon} ${cfg.label.replace(' 팀 주문','')}`);
      Object.entries(menus).forEach(([menuKey, optMap]) => {
        lines.push(`▸ ${menuKey}`);
        Object.values(optMap).forEach(({ o, names, count }) => {
          const tags = makeOptTags(o);
          const optStr = tags.filter(t => !t.text.startsWith('📝')).map(t => t.text).join('/') || '기본';
          const memo = tags.find(t => t.text.startsWith('📝'));
          lines.push(`   ${optStr} × ${count}  (${names.join(', ')})${memo ? '  ' + memo.text : ''}`);
        });
      });
    });
    lines.push('');
  });
  lines.push(`📊 전체 총 ${orders.length}건`);
  document.getElementById('copy-box').textContent = lines.join('\n');
  document.getElementById('copy-area').style.display = 'block';
}

function deleteOrder(id) {
  window.fbDeleteOrder(id).then(() => showToast('주문이 삭제되었습니다'));
}

function clearAll() {
  if (!confirm('전체 주문을 초기화할까요? (모든 사람에게 영향을 줍니다)')) return;
  window.fbClearAll().then(() => showToast('초기화 완료'));
}

function copyOrders() {
  navigator.clipboard.writeText(document.getElementById('copy-box').textContent)
    .then(() => showToast('클립보드에 복사됐어요 📋'));
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i===0 && tab==='order') || (i===1 && tab==='summary'));
  });
  document.getElementById('screen-order').classList.toggle('active', tab==='order');
  document.getElementById('screen-summary').classList.toggle('active', tab==='summary');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
